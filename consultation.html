<body>

<!-- FORM SECTION -->

<section class="request-setup-section">

<div class="container">

    <div class="back-navigation">

        <h1

            data-lang-fr="Demandez une Consultation Produit">

            Request A Product Consultation

        </h1>

            Interested in one of our upcoming SaaS tools? Tell us what you're looking for and we'll help you find the best solution.

    <!-- FORM -->

        <input

        <!-- CONTACT -->

        <div class="form-group">

            <label

        </div>

        <div class="form-group">

            </label>

            <input type="text"
                   name="company"

        <!-- BUSINESS -->

            <label

                data-lang-fr="Secteur d'activité">

            </label>

            <select name="industry" required>

                <option value=""
                disabled
                selected
                data-lang-en="Select your industry"
                data-lang-fr="Secteur d'activité">

                <option
                data-lang-en="E-Commerce"

                <option

                <option

                Marketing Agency

                </option>
                <option
                data-lang-en="Consulting"
                data-lang-fr="Consulting">

                Consulting

                </option>
                <option
                data-lang-en="Healthcare"
                data-lang-fr="Santé">

                Healthcare

                </option>
                <option

                data-lang-fr="Éducation">

                Education

                </option>
                <option
                data-lang-en="Other"
                data-lang-fr="Autre">

                Other

        </div>

        <div class="form-group">

            <label

                data-lang-en="Team Size"
                data-lang-fr="Taille de l'équipe">

                Team Size

            </label>

            <select name="teamSize" required>

                <option value=""
                disabled
                selected
                data-lang-en="Select your team size"
                data-lang-fr="Sélectionnez la taille de votre équipe">

                Select your team size

                </option>

                <option
                data-lang-en="Solo Entrepreneur"
                data-lang-fr="Entrepreneur solo">

                Solo Entrepreneur

                </option>

                <option
                data-lang-en="2-10 Employees"
                data-lang-fr="2-10 Employés">

                2-10 Employees

                <option

        </div>

            <div class="form-group">

                <label
                data-lang-en="Reason for Contact"
                data-lang-fr="Motif de la demande">

                <option value=""

                data-lang-fr="Sélectionnez une raison">

                </option>

                data-lang-en="Early Access"
                data-lang-fr="Accès anticipé">

                Early Access

                </option>

                data-lang-fr="Démonstration produit">

                Product Demo

                Feature Request

                data-lang-fr="Décrivez vos besoins">

                Tell Us About Your Needs

            </label>

            <textarea
                name="consultationNeeds"
                rows="5"
                required
                placeholder="Tell us what interests you about this product, your business needs, or any questions you have."
                data-placeholder-en="Tell us what interests you about this product, your business needs, or any questions you have."
                data-placeholder-fr="Expliquez ce qui vous intéresse dans ce produit, vos besoins ou les questions que vous souhaitez nous poser."></textarea>

        </div>

        <div class="form-group">

            <label

                data-lang-en="Current Tools & Software (Optional)"
                data-lang-fr="Outils et logiciels actuels (Optionnel)">

                Current Tools & Software (Optional)

            </label>

            <textarea
                name="currentTools"
                rows="4"
                placeholder="List any current tools or software you are using (optional)"
                data-placeholder-en="List any current tools or software you are using (optional)"
                data-placeholder-fr="Listez tous les outils ou logiciels que vous utilisez actuellement (optionnel)"></textarea>

        </div>

        <!-- SUBMIT -->

        <button
            type="submit"
            class="submit-btn"

            data-lang-en="Request Consultation"
            data-lang-fr="Demander une consultation">

            Request Consultation

        </button>

    </form>

    <!-- SUCCESS MESSAGE -->

    <div id="successMessage"
         style="display:none;">

        <h2

            data-lang-en="✓ Request Received"
            data-lang-fr="✓ Demande reçue">

            ✓ Request Received

        </h2>

        <p

            data-lang-en="Thank you for contacting AutomateSuite. We'll review your requirements and get back to you shortly."
            data-lang-fr="Merci d'avoir contacté AutomateSuite. Nous étudierons votre demande et reviendrons vers vous rapidement.">

            Thank you for contacting AutomateSuite.

        </p>

    </div>

</div>

</section>

<footer>

<p>

    © 2026 AutomateSuite

</p>

</footer>

<script>

/* =========================
   LANGUAGE DETECTION
========================= */

const currentLanguage =
localStorage.getItem("language") || "en";

document
.querySelectorAll("[data-lang-en]")
.forEach(el => {

    const translation =
        currentLanguage === "fr"
        ? el.dataset.langFr
        : el.dataset.langEn;

    if (!translation) return;

    if (
        el.tagName === "OPTION" ||
        el.tagName === "LABEL" ||
        el.tagName === "BUTTON" ||
        el.tagName === "P" ||
        el.tagName === "H1" ||
        el.tagName === "H2" ||
        el.tagName === "H3" ||
        el.tagName === "SPAN"
    ) {

        el.textContent =
        translation;

    }

});

/* =========================
   PLACEHOLDERS
========================= */

document
.querySelectorAll("[data-placeholder-en]")
.forEach(el => {

    el.placeholder =
        currentLanguage === "fr"
        ? el.dataset.placeholderFr
        : el.dataset.placeholderEn;

});

</script>

<script>

emailjs.init({
    publicKey: "rY5u_6m_UtVfQsO5G"
});

document
.getElementById("setupForm")
.addEventListener("submit", function(e) {

    e.preventDefault();

    const submitBtn =
    document.querySelector(".submit-btn");

    submitBtn.disabled = true;

    submitBtn.textContent =
    currentLanguage === "fr"
    ? "Envoi en cours..."
    : "Sending...";

    emailjs.sendForm(
        "service_fnchujr",
        "template_cqii9iu",
        this
    )

    .then(function() {

        window.location.href =
        "consultation-success.html";

    })

    .catch(function(error) {

        console.error(error);

        alert(
            "An error occurred while sending your request."
        );

    });

});

</script>
<script>
const savedTheme =
localStorage.getItem("theme");

if(savedTheme === "light") {

    document.body.classList.add(
        "light-mode"
    );

}
</script>
</body>

</html>
