    a:hover {

  </style>
<style>

 </head>
 <body class="lang-fr">

    Merci pour votre demande !
   </h1>
   <p data-lang-en="Your automation request has been successfully received."
    data-lang-fr="Votre demande d'automatisation a été reçue avec succès.">
    Your automation request has been successfully received.

    <p data-lang-en="We'll review your requirements and get back to you shortly."

   <!-- BACK TO PRICING -->

    <a href="pricing.html"
    class="back-pricing-btn"

    data-lang-fr="← Retour aux tarifs">

    ← Back to Pricing

    </a>
  </div>
  <script>
   function detectLanguage() {
    const urlLang = new URLSearchParams(window.location.search).get("lang");
    const localLang = localStorage.getItem("language");
    return urlLang || localLang || "fr";
  }

  const lang = detectLanguage();
  document.body.classList.remove("lang-fr", "lang-en");
  document.body.classList.add("lang-" + lang);

  document.querySelectorAll("[data-lang-fr]").forEach(el => {
    el.textContent = el.getAttribute("data-lang-" + lang);
  });

  // Mise à jour du <title>
const titleEl = document.getElementById("dynamic-title");
if (titleEl) {
  const newTitle = titleEl.getAttribute("data-lang-" + lang);
  if (newTitle) titleEl.textContent = newTitle;
}
  </script>
 </body>
</html>
