<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | AutomateSuite</title>

    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>
<nav class="navbar">

    <div class="nav-container">

        <!-- Logo -->
        <a href="index.html" class="logo">
            AutomateSuite
        </a>

        <!-- Navigation Links -->
        <div class="nav-menu" id="nav-menu">

            <div class="nav-links">

                <a href="index.html"
                   data-lang-en="Home"
                   data-lang-fr="Accueil">
                   Home
                </a>

                <a href="about.html"
                   data-lang-en="About"
                   data-lang-fr="À propos">
                   About
                </a>

                <a href="services.html"
                   data-lang-en="Services"
                   data-lang-fr="Services">
                   Services
                </a>

                <a href="products.html"
                   data-lang-en="Products"
                   data-lang-fr="Produits">
                   Products
                </a>

                <a href="contact.html"
                   data-lang-en="Contact"
                   data-lang-fr="Contact">
                   Contact
                </a>

            </div>

        </div>

        <!-- Right Controls -->
        <div class="menu-controls">

            <button id="theme-toggle">
                ☀️
            </button>

            <div class="language-selector">

                <span onclick="setLanguage('en')">EN</span>
                <span>|</span>
                <span onclick="setLanguage('fr')">FR</span>

            </div>

        </div>
        
        <!-- Hamburger -->
        <div class="hamburger" id="hamburger">
            ☰
        </div>

        <!-- Overlay -->
        <div class="menu-overlay" id="menu-overlay"></div>
      
    </div>

</nav>

    <section class="page-section">

    <div class="container">   

        <!-- Contact Title -->
        <h1
            data-lang-en="Contact Us"
            data-lang-fr="Contactez-nous">
            Contact Us
        </h1>

        <!-- Contact Description -->
        <p
            data-lang-en="Have a project, automation idea or business solution in mind? Get in touch with AutomateSuite."
            data-lang-fr="Vous avez un projet, une idée d’automatisation ou une solution business en tête ? Contactez AutomateSuite.">
            
            Have a project, automation idea or business solution in mind? Get in touch with AutomateSuite.
        </p>

        <!-- Contact Form -->
        <form>

            <!-- Name -->
            <label
                data-lang-en="Your Name"
                data-lang-fr="Votre Nom">
                Your Name
            </label>

            <input type="text" placeholder="John Doe">

            <br><br>

            <!-- Email -->
            <label
                data-lang-en="Your Email"
                data-lang-fr="Votre Email">
                Your Email
            </label>

            <input type="email" placeholder="example@email.com">

            <br><br>

            <!-- Message -->
            <label
                data-lang-en="Your Message"
                data-lang-fr="Votre Message">
                Your Message
            </label>

            <textarea rows="5" placeholder="Write your message..."></textarea>

            <br><br>

            <!-- Submit Button -->
            <button
                type="submit"
                data-lang-en="Send Message"
                data-lang-fr="Envoyer le message">
                Send Message
            </button>

        </form>
    </div>
    </section>

    <script src="assets/js/script.js"></script>

</body>
</html>
